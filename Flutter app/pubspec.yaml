name: timeapp_flutter
description: A new Flutter project for tracking time at attractions.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  shorebird_code_push: ^2.0.7
  flutter:
    sdk: flutter
  http: ^1.1.0
  flutter_secure_storage: ^11.0.0
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.1
  path: ^1.8.3
  provider: ^6.1.1
  uuid: ^4.3.3
  geolocator: ^14.0.3
  permission_handler: ^13.0.1
  flutter_local_notifications: ^22.3.0
  dbcrypt: ^2.0.0
  url_launcher: ^6.3.0
  dio: ^5.4.0
  open_filex: ^4.3.4
  package_info_plus: ^10.2.1
  ntp: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.14.1
  build_runner: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - shorebird.yaml
