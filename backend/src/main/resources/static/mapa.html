<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Lasu - Geotagi</title>
    
    <!-- Skrypt autoryzacji i Navbar -->
    <script src="auth.js"></script>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --active-color: #10b981;
            --inactive-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .main-content {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Glassmorphism Sidebar */
        .sidebar {
            width: 400px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
        }

        .header {
            padding: 24px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Tabela w sidebarze */
        .table-container {
            flex-grow: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .attraction-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .attraction-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--accent-glow);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-weight: 600;
            font-size: 16px;
        }

        .status-badge {
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.2);
            color: var(--active-color);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .status-inactive {
            background: rgba(239, 68, 68, 0.2);
            color: var(--inactive-color);
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .coords-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .coord-item span {
            color: var(--text-main);
            font-weight: 600;
            font-family: monospace;
        }

        /* Mapa */
        #map {
            flex-grow: 1;
            height: 100%;
            background: #1a1a2e; /* Ciemne tło zanim załadują się kafelki */
        }

        /* Stylizacja kafelków mapy dla Dark Mode (odwrócenie kolorów) */
        .leaflet-layer,
        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out,
        .leaflet-control-attribution {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }

        /* Customizacja paska przewijania */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.4);
        }

    </style>
</head>
<body>

    <div class="main-content">
        <div class="sidebar">
            <div class="header">
                <h1>Geotagi Lasu</h1>
                <p>Interaktywny podgląd stref geofence</p>
            </div>
            <div class="table-container" id="attractionsList">
                <!-- Tutaj zostaną wygenerowane karty przez JavaScript -->
                <div style="text-align: center; padding: 40px; color: #94a3b8;">
                    Ładowanie danych z serwera...
                </div>
            </div>
        </div>

        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script>
        // Inicjalizacja mapy (domyślny środek Polski)
        const map = L.map('map', {
            zoomControl: false // Wyłączamy domyślny by dodać własny ładniejszy jeśli trzeba
        }).setView([51.9194, 19.1451], 6);

        // Dodanie prawego dolnego zooma
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Kafelki OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let mapMarkers = [];

        let isFirstLoad = true;

        // Pobieranie danych z naszego endpointu
        async function fetchAttractions() {
            try {
                const response = await fetch('/api/export/attractions/json');
                if (!response.ok) throw new Error('Błąd pobierania danych');
                
                const attractions = await response.json();
                renderDashboard(attractions);
            } catch (error) {
                console.error('Błąd:', error);
                if (isFirstLoad) {
                    document.getElementById('attractionsList').innerHTML = 
                        `<div style="text-align: center; padding: 40px; color: #ef4444;">
                            Błąd połączenia z bazą danych.<br>Upewnij się, że serwer działa prawidłowo.
                        </div>`;
                }
            }
        }

        function renderDashboard(attractions) {
            const listContainer = document.getElementById('attractionsList');
            
            // Zachowujemy pozycję scrolla w tabeli
            const scrollPos = listContainer.scrollTop;
            listContainer.innerHTML = ''; 

            if (attractions.length === 0) {
                listContainer.innerHTML = `<div style="text-align: center; padding: 40px; color: #94a3b8;">Brak atrakcji w bazie.</div>`;
                return;
            }

            const bounds = L.latLngBounds();

            // Czyszczenie starych markerów z mapy
            mapMarkers.forEach(marker => map.removeLayer(marker));
            mapMarkers = [];

            attractions.forEach(attr => {
                // 1. Dodawanie okręgów na mapę
                const circleColor = attr.isActive ? '#10b981' : '#ef4444';
                const circle = L.circle([attr.latitude, attr.longitude], {
                    color: circleColor,
                    fillColor: circleColor,
                    fillOpacity: 0.3,
                    radius: attr.radius
                }).addTo(map);

                // Dymek z informacją (Tooltip)
                circle.bindTooltip(`<b>${attr.name}</b><br>Promień: ${attr.radius}m`, {
                    direction: 'top',
                    className: 'custom-tooltip'
                });

                mapMarkers.push(circle);
                bounds.extend([attr.latitude, attr.longitude]);

                // 2. Dodawanie karty do panelu bocznego
                const card = document.createElement('div');
                card.className = 'attraction-card';
                card.innerHTML = `
                    <div class="card-header">
                        <div class="card-title">${attr.name}</div>
                        <div class="status-badge ${attr.isActive ? 'status-active' : 'status-inactive'}">
                            ${attr.isActive ? 'Aktywna' : 'Nieaktywna'}
                        </div>
                    </div>
                    <div class="coords-grid">
                        <div class="coord-item">Lat: <span>${attr.latitude.toFixed(6)}</span></div>
                        <div class="coord-item">Lng: <span>${attr.longitude.toFixed(6)}</span></div>
                        <div class="coord-item">Promień: <span>${attr.radius} m</span></div>
                    </div>
                `;

                // Kliknięcie w kartę przesuwa mapę na tę strefę
                card.addEventListener('click', () => {
                    map.flyTo([attr.latitude, attr.longitude], 17, {
                        animate: true,
                        duration: 1.5
                    });
                    circle.openTooltip();
                });

                listContainer.appendChild(card);
            });
            
            // Przywracamy scroll
            listContainer.scrollTop = scrollPos;

            // Dopasuj widok mapy tylko za pierwszym załadowaniem, żeby nie psuć użytkownikowi przeglądania
            if (isFirstLoad && mapMarkers.length > 0) {
                map.fitBounds(bounds, { padding: [50, 50] });
                isFirstLoad = false;
            }
        }

        // Uruchom pierwsze pobieranie
        fetchAttractions();
        
        // Pętla czasu rzeczywistego (odświeża dane z bazy co 3 sekundy)
        setInterval(fetchAttractions, 3000);

    </script>
</body>
</html>
